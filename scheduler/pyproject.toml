[project]
name = "model-gateway-scheduler"
version = "0.1.0"
description = "Admission scheduler and vLLM router for the internal model gateway"
requires-python = ">=3.12"
dependencies = [
  "anyio>=4.6,<5",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "prometheus-client>=0.21,<1",
  "pydantic>=2.9,<3",
  "PyYAML>=6.0,<7",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
